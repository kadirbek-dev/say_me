name: say_me
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # 1. Бэкенд и база данных
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.0.0
  supabase_flutter: ^2.3.0
  google_sign_in: ^6.2.1

  # 2. Хранение настроек (тема, язык, токен)
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

  # 3. Управление состоянием
  provider: ^6.1.1

  # 4. Вызов экстренных служб
  url_launcher: ^6.2.4

  # 5. Иконки
  cupertino_icons: ^1.0.6

  # 6. Камера, ИИ-сканеры и разрешения
  camera: ^0.11.0+2
  google_mlkit_face_detection: ^0.12.0
  google_mlkit_text_recognition: ^0.14.0
  permission_handler: ^11.3.1

  # 7. Шифрование сообщений (E2E)
  encrypt: ^5.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true