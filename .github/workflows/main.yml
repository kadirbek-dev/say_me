name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Android SDK tools
      uses: android-actions/setup-android@v3

    - name: Install Android NDK & CMake
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "cmake;3.22.1" "ndk;25.2.9519653"

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Find Project Dir and Build
      run: |
        PROJECT_DIR=$(find . -name "pubspec.yaml" -not -path "*/.*" | head -n 1 | xargs dirname)
        echo "Found project directory at: $PROJECT_DIR"
        cd "$PROJECT_DIR"
        flutter pub get
        flutter build apk --release --no-tree-shake-icons
        mkdir -p "$GITHUB_WORKSPACE/output"
        cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/output/"

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: output/app-release.apk
